# One person's JobPilot on Render: the app and its database, in Singapore
# (closest to India). New → Blueprint → this repository. Render asks for
# DOSSIER_PASSWORD (the argon2id hash, see RENDER.md); the rest fills itself.
# Free plans, for trying it out. A free service sleeps after 15 minutes
# without visits (the inbox check and the job agent pause until the next
# visit wakes it, about a minute), and a free database is deleted after 30
# days. To keep it: in the dashboard, move the service to Starter and the
# database to Basic-256mb; nothing else changes.

services:
  - type: web
    name: jobpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    # One copy only: the inbox check, the agent and the backups run inside the app.
    numInstances: 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: DOSSIER_PASSWORD
        sync: false
      - key: DOSSIER_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Kolkata

databases:
  - name: jobpilot-db
    region: singapore
    plan: free
    databaseName: jobpilot
    user: jobpilot
    ipAllowList: []
